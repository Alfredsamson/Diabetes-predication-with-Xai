<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iris Classifier</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Iris Classifier</h1>
        <p>Enter measurements to predict the Iris species.</p>
      </header>

      <form id="predict-form" class="card">
        <div class="grid">
          <label>
            <span>Sepal length (cm)</span>
            <input type="number" step="0.01" id="sepal_length" value="5.1" required />
          </label>
          <label>
            <span>Sepal width (cm)</span>
            <input type="number" step="0.01" id="sepal_width" value="3.5" required />
          </label>
          <label>
            <span>Petal length (cm)</span>
            <input type="number" step="0.01" id="petal_length" value="1.4" required />
          </label>
          <label>
            <span>Petal width (cm)</span>
            <input type="number" step="0.01" id="petal_width" value="0.2" required />
          </label>
        </div>
        <button type="submit">Predict</button>
      </form>

      <section id="result" class="card hidden">
        <h2>Prediction</h2>
        <div class="prediction-value" id="predicted_class">—</div>
        <div id="probabilities"></div>
      </section>

      <footer>
        <a href="https://scikit-learn.org/" target="_blank" rel="noreferrer">scikit-learn</a> ·
        <a href="https://fastapi.tiangolo.com/" target="_blank" rel="noreferrer">FastAPI</a>
      </footer>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
